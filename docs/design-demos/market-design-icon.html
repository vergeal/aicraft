<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>应用市场设计 · 技能图标</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 48px; background: #0e0f11; color: #e6e8ec; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  h2 { font-size: 12px; font-weight: 500; color: #7f8794; margin: 0 0 20px; letter-spacing: .04em; }
  .wrap { display: flex; align-items: flex-end; gap: 28px; }
  .m96 { width: 96px; height: 96px; }
  .m40 { width: 40px; height: 40px; }
  .m24 { width: 24px; height: 24px; }
  .m96 svg, .m40 svg, .m24 svg { width: 100%; height: 100%; display: block; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 36px; padding: 10px 12px; border-radius: 10px; max-width: 420px; }
  .row:hover { background: #17181b; }
  .name { font-size: 13px; color: #e6e8ec; }
  .desc { font-size: 12px; color: #8b919c; }
  .panel { background: #17181b; border: 1px solid #232529; border-radius: 12px; padding: 24px; }
</style>
</head>
<body>
  <h2>96 / 40 / 24 像素</h2>
  <div class="wrap">
    <span class="m96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#16867f"/><rect x="6" y="6" width="4" height="4" rx="1.4" fill="#ffffff"/><rect x="14" y="6" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="6" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="14" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/></svg></span>
    <span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#16867f"/><rect x="6" y="6" width="4" height="4" rx="1.4" fill="#ffffff"/><rect x="14" y="6" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="6" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="14" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/></svg></span>
    <span class="m24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#16867f"/><rect x="6" y="6" width="4" height="4" rx="1.4" fill="#ffffff"/><rect x="14" y="6" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="6" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="14" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/></svg></span>
  </div>

  <h2 style="margin-top:48px">列表里的样子</h2>
  <div class="panel" style="max-width:420px">
    <div class="row">
      <span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#16867f"/><rect x="6" y="6" width="4" height="4" rx="1.4" fill="#ffffff"/><rect x="14" y="6" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="6" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/><rect x="14" y="14" width="4" height="4" rx="1.4" fill="none" stroke="#cdf5ef" stroke-width="1.2"/></svg></span>
      <span><span class="name" style="display:block">应用市场设计</span><span class="desc" style="display:block">列表型浏览界面的形态、控件尺寸与图标画法</span></span>
    </div>
  </div>
</body>
</html>
