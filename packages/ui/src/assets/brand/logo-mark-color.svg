<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Brand mark: fixed colours, outside the currentColor system (10-icons §5). */
    .grad-start {
      stop-color: #00e08a;
    }
    .grad-mid {
      stop-color: #00d4a0;
    }
    .grad-end {
      stop-color: #00b4ff;
    }
    .counter {
      fill: #5eead4;
    }
    @media (prefers-color-scheme: dark) {
      .counter {
        fill: #99f6e4;
      }
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop class="grad-start" offset="0" />
      <stop class="grad-mid" offset="0.55" />
      <stop class="grad-end" offset="1" />
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="5.5" stroke="url(#grad)" stroke-width="2" />
  <rect class="counter" x="8.5" y="8.5" width="7" height="7" rx="1.5" />
</svg>
