<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>配色方案 · 高饱和</title>
    <style>
      :root {
        --bg: #fafafa;
        --panel: #ffffff;
        --text: #0d0d0d;
        --text-secondary: #61666b;
        --text-tertiary: #81858c;
        --border: rgba(0, 0, 0, 0.08);
        --font: -apple-system, "Inter", "PingFang SC", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        line-height: 18px;
      }
      h1 { margin: 0 0 4px; font-size: 16px; font-weight: 590; line-height: 22px; }
      .lede { margin: 0 0 24px; color: var(--text-secondary); max-width: 70ch; }
      .mark { display: block; }
      .grid { display: grid; gap: 16px; }
      .opt {
        display: grid;
        gap: 12px;
        padding: 16px 20px;
        border-radius: 14px;
        background: var(--panel);
        box-shadow: inset 0 0 0 0.5px var(--border);
      }
      header { display: flex; align-items: center; gap: 10px; }
      .tag {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
        font-size: 11px;
        font-weight: 590;
      }
      .name { font-weight: 590; }
      .hex { color: var(--text-tertiary); font-size: 11px; font-family: ui-monospace, monospace; }
      .samples { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .on {
        display: grid;
        place-items: center;
        width: 168px;
        height: 132px;
        border-radius: 12px;
      }
      .on.light { background: #ffffff; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.1); }
      .on.dark { background: rgb(21,21,23); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.12); }
      .sizes { display: flex; align-items: center; gap: 20px; padding-left: 8px; }
    </style>
  </head>

    <h1>配色方案</h1>
    <p class="lede">
      同一个几何（24 网格、描边 2、渐变环 + 实心核），只换色。每行左为浅底、右为深底，再给小尺寸 32 / 16 预览。
      色值都是高饱和纯色端点，中间段让渐变过渡。
    </p>

  </defs>
  <rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="url(#gA-l)" stroke-width="2" />
