<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沉浸式问答首页 · 设计演示</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* =====================================================================
         沉浸式问答首页 · 按 20～27 章「桌面体验系统」落地
         空间：三块连续表面，只有工作区是主舞台
         材质：侧栏轻洗色，内容区实色，浮层才有一层玻璃
         光：仅一束极弱环境光 + 顶栏 1px 内高光
         时间：550ms 内完成入场，发送后连续过渡到会话态
         ===================================================================== */
      * { box-sizing: border-box; }

      /* ---------- 1. 页面级材质变量：只做映射，不引入新色 ---------- */
      :root {
        --surface-canvas: var(--p-gray-25);
        --surface-sidebar: var(--p-gray-50);
        --surface-raised: var(--p-white);
        --surface-composer: var(--p-white);
        --surface-suggestion: var(--p-white);
        --surface-suggestion-hover: var(--p-gray-25);
        --text-strong: var(--p-black);
        --text-body: var(--p-gray-800);
        --text-muted: var(--p-gray-600);
        --text-faint: var(--p-gray-500);
        --line: rgb(0 0 0 / 0.08);
        --line-strong: rgb(0 0 0 / 0.13);
        --accent: #5b5bd6;
        --accent-ring: rgb(91 91 214 / 0.14);
        --ambient: radial-gradient(
          ellipse 560px 320px at 50% 26%,
          rgb(255 255 255 / 0.9),
          transparent 72%
        );
        --edge-light: inset 0 1px 0 rgb(255 255 255 / 0.9);
        --shadow-composer: 0 1px 2px rgb(16 18 27 / 0.04), 0 10px 28px rgb(16 18 27 / 0.05);
        --shadow-composer-focus: 0 0 0 1px var(--accent-ring), 0 2px 6px rgb(16 18 27 / 0.05),
          0 12px 32px rgb(16 18 27 / 0.07);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface-canvas: var(--v2-background-bg-base);
          --surface-sidebar: #19191c;
          --surface-raised: #1c1c20;
          --surface-composer: #1d1d21;
          --surface-suggestion: #1b1b1f;
          --surface-suggestion-hover: #202024;
          --text-strong: #f4f4f5;
          --text-body: #d4d4d8;
          --text-muted: #9b9ba3;
          --text-faint: #71717a;
          --line: rgb(255 255 255 / 0.08);
          --line-strong: rgb(255 255 255 / 0.14);
          --accent: #8b8bf5;
          --accent-ring: rgb(139 139 245 / 0.16);
          --ambient: radial-gradient(
            ellipse 560px 320px at 50% 26%,
            rgb(255 255 255 / 0.035),
            transparent 72%
          );
          --edge-light: inset 0 1px 0 rgb(255 255 255 / 0.035);
          --shadow-composer: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.22);
          --shadow-composer-focus: 0 0 0 1px var(--accent-ring), 0 2px 6px rgb(0 0 0 / 0.32),
            0 14px 36px rgb(0 0 0 / 0.28);
        }
      }

      :root[data-theme="dark"] {
        --surface-canvas: var(--v2-background-bg-base);
        --surface-sidebar: #19191c;
        --surface-raised: #1c1c20;
        --surface-composer: #1d1d21;
        --surface-suggestion: #1b1b1f;
        --surface-suggestion-hover: #202024;
        --text-strong: #f4f4f5;
        --text-body: #d4d4d8;
        --text-muted: #9b9ba3;
        --text-faint: #71717a;
        --line: rgb(255 255 255 / 0.08);
        --line-strong: rgb(255 255 255 / 0.14);
        --accent: #8b8bf5;
        --accent-ring: rgb(139 139 245 / 0.16);
        --ambient: radial-gradient(
          ellipse 560px 320px at 50% 26%,
          rgb(255 255 255 / 0.035),
          transparent 72%
        );
        --edge-light: inset 0 1px 0 rgb(255 255 255 / 0.035);
        --shadow-composer: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.22);
        --shadow-composer-focus: 0 0 0 1px var(--accent-ring), 0 2px 6px rgb(0 0 0 / 0.32),
          0 14px 36px rgb(0 0 0 / 0.28);
      }

      /* ---------- 2. 应用外壳：铺满窗口，像真正的客户端 ---------- */
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--surface-canvas);
        color: var(--text-strong);
        font-family: var(--font-sans);
        font-size: var(--fs-14);
        line-height: var(--lh-14);
        -webkit-font-smoothing: antialiased;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-columns: var(--layout-sidebar) minmax(0, 1fr);
        grid-template-rows: 48px minmax(0, 1fr);
        grid-template-areas:
          "topbar topbar"
          "sidebar workspace";
      }

      /* ---------- 3. 顶栏：拖拽区，只有它带内高光 ---------- */
      .topbar {
        grid-area: topbar;
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: var(--s-4);
        padding: 0 12px 0 84px;
        background: color-mix(in srgb, var(--surface-canvas) 82%, transparent);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        box-shadow: var(--edge-light), 0 0.5px 0 var(--line);
        -webkit-app-region: drag;
        user-select: none;
      }
      .topbar button, .topbar .tag, .topbar .spots { -webkit-app-region: no-drag; }

      /* 红绿灯（演示：真实客户端由 Electron 绘制） */
      .spots {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 8px;
      }
      .spots span {
        width: 12px; height: 12px; border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.16);
      }
      .spots span:nth-child(1) { background: #ff5f57; }
      .spots span:nth-child(2) { background: #febc2e; }
      .spots span:nth-child(3) { background: #28c840; }

      .topbar-title {
        font-size: var(--fs-13);
        line-height: var(--lh-13);
        font-weight: var(--fw-medium);
        color: var(--text-muted);
      }
      .topbar-spacer { flex: 1; }

      .icon-button {
        width: 28px; height: 28px;
        display: inline-flex; align-items: center; justify-content: center;
        border: 0; padding: 0; border-radius: var(--r-sm);
        background: transparent; color: var(--text-muted);
        transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
      }
      @media (hover: hover) {
        .icon-button:hover { background: var(--c-hover); color: var(--text-strong); }
      }
      .icon-button:active { background: var(--c-active); }

      .tag {
        height: 20px; display: inline-flex; align-items: center;
        padding: 0 8px; border-radius: var(--r-full);
        box-shadow: inset 0 0 0 0.5px var(--line);
        color: var(--text-faint);
        font-size: var(--fs-11); line-height: var(--lh-11);
      }

      /* ---------- 4. 侧栏：导航区的视觉重量低于工作区 ---------- */
      .sidebar {
        grid-area: sidebar;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 8px 12px 12px;
        background:
          radial-gradient(120% 40% at 50% 0%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 70%),
          var(--surface-sidebar);
        box-shadow: 0.5px 0 0 var(--line);
      }

      .brand {
        display: flex; align-items: center; gap: 8px;
        height: 36px; padding: 0 8px;
        color: var(--text-strong);
        font-size: var(--fs-14);
        font-weight: var(--fw-semibold);
      }
      .brand .mark { width: 20px; height: 20px; flex: 0 0 auto; }
      .brand .tag { margin-left: auto; }

      .new-chat {
        display: flex; align-items: center; gap: 8px;
        width: 100%; height: 36px;
        margin: 8px 0 12px;
        padding: 0 10px;
        border: 0; border-radius: var(--r-md);
        background: var(--c-primary-fill);
        color: var(--c-primary-text);
        font-family: inherit; font-size: var(--fs-13); font-weight: var(--fw-medium);
        transition: background-color var(--dur-fast) ease;
      }
      .new-chat:hover { background: var(--c-primary-fill-hover); }
      .new-chat .keys { margin-left: auto; opacity: 0.6; font-size: var(--fs-11); }

      .nav { display: flex; flex-direction: column; gap: 2px; }
      .nav-item {
        display: flex; align-items: center; gap: 10px;
        height: 32px; padding: 0 10px;
        border: 0; border-radius: var(--r-sm);
        background: transparent;
        color: var(--text-body);
        font-family: inherit; font-size: var(--fs-13); line-height: var(--lh-13);
        text-align: left;
        transition: background-color var(--dur-fast) ease;
      }
      @media (hover: hover) { .nav-item:hover { background: var(--c-hover); } }
      .nav-item[aria-current="page"] {
        background: var(--c-selected);
        color: var(--text-strong);
        font-weight: var(--fw-medium);
      }
      .nav-item .count {
        margin-left: auto; color: var(--text-faint);
        font-variant-numeric: tabular-nums;
        font-size: var(--fs-11);
      }

      .section-head {
        display: flex; align-items: center;
        margin: 20px 0 4px; padding: 0 10px;
        color: var(--text-faint);
        font-size: var(--fs-11); line-height: var(--lh-11);
        letter-spacing: 0.01em;
      }
      .section-head .actions { margin-left: auto; display: flex; gap: 2px; }

      .recent { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; min-height: 0; }
      .recent-item {
        display: flex; align-items: center; gap: 10px;
        height: 30px; padding: 0 10px;
        border: 0; border-radius: var(--r-sm);
        background: transparent; color: var(--text-body);
        font-family: inherit; font-size: var(--fs-13); line-height: var(--lh-13);
        text-align: left;
        transition: background-color var(--dur-fast) ease;
      }
      .recent-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .recent-item .when { color: var(--text-faint); font-size: var(--fs-11); }
      @media (hover: hover) { .recent-item:hover { background: var(--c-hover); } }
      .recent-item[aria-current="page"] { background: var(--c-selected); color: var(--text-strong); }

      .account {
        display: flex; align-items: center; gap: 10px;
        margin-top: auto; padding: 10px;
        border: 0; border-radius: var(--r-md);
        background: transparent; color: var(--text-body);
        font-family: inherit; text-align: left;
        transition: background-color var(--dur-fast) ease;
      }
      @media (hover: hover) { .account:hover { background: var(--c-hover); } }
      .avatar {
        width: 26px; height: 26px; flex: 0 0 auto;
        display: grid; place-items: center;
        border-radius: var(--r-full);
        background: var(--surface-raised);
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
        font-size: var(--fs-11); font-weight: var(--fw-semibold);
        color: var(--text-muted);
      }
      .account .meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
      .account .who { font-size: var(--fs-12); line-height: var(--lh-12); color: var(--text-body); }
      .account .where { font-size: var(--fs-11); line-height: var(--lh-11); color: var(--text-faint); }

      /* ---------- 5. 工作区：唯一主舞台，一束极弱环境光 ---------- */
      .workspace {
        grid-area: workspace;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--surface-canvas);
      }
      .workspace::before {
        content: "";
        position: absolute; inset: 0; z-index: -1;
        pointer-events: none;
        background: var(--ambient);
      }

      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .home {
        width: min(720px, 100%);
        display: flex;
        flex-direction: column;
      }

      .home-head { text-align: center; }
      .home-title {
        margin: 0;
        font-size: 28px;
        line-height: 36px;
        font-weight: var(--fw-semibold);
        letter-spacing: -0.02em;
        color: var(--text-strong);
      }
      .home-sub {
        margin: 10px 0 0;
        font-size: var(--fs-14);
        line-height: var(--lh-14);
        color: var(--text-muted);
      }

      /* ---------- 6. Composer：全页唯一的强视觉入口 ---------- */
      .composer {
        position: relative;
        width: 100%;
        height: 176px;
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        padding: 16px;
        border-radius: 24px;
        background: var(--surface-composer);
        box-shadow: inset 0 0 0 1px var(--line), var(--edge-light), var(--shadow-composer);
        transition: box-shadow 180ms ease, transform 240ms var(--ease-out);
      }
      @media (hover: hover) {
        .composer:hover { box-shadow: inset 0 0 0 1px var(--line-strong), var(--edge-light), var(--shadow-composer); }
      }
      .composer:focus-within {
        box-shadow: inset 0 0 0 1px var(--accent), var(--edge-light), var(--shadow-composer-focus);
      }

      .composer-input {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .composer textarea {
        flex: 1;
        width: 100%;
        min-width: 0;
        border: 0; outline: 0; resize: none;
        background: transparent;
        color: var(--text-strong);
        font-family: inherit;
        font-size: 15px;
        line-height: 23px;
        padding: 2px 2px 0;
      }
      .composer textarea::placeholder { color: var(--text-faint); }

      .composer-bar {
        flex: 0 0 auto;
        height: 36px;
        display: flex; align-items: center; gap: 6px;
        margin-top: 12px;
      }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        height: 28px; padding: 0 9px;
        border: 0; border-radius: var(--r-sm);
        background: transparent; color: var(--text-muted);
        font-family: inherit; font-size: var(--fs-12); line-height: var(--lh-12);
        transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
      }
      @media (hover: hover) { .chip:hover { background: var(--c-hover); color: var(--text-strong); } }
      .chip .ico { width: 15px; height: 15px; }

      .bar-spacer { flex: 1; }

      .send {
        width: 36px; height: 36px;
        display: inline-flex; align-items: center; justify-content: center;
        border: 0; border-radius: var(--r-md);
        background: var(--c-primary-fill);
        color: var(--c-primary-text);
        transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
      }
      .send:disabled { opacity: 0.28; }
      .send:not(:disabled):active { transform: scale(0.94); }
      .send .ico { width: 17px; height: 17px; }

      /* ---------- 7. 建议卡：不是入口导航，是快捷模板 ---------- */
      .suggestions {
        margin-top: 28px;
      }
      .suggestions-head {
        margin: 0 0 12px;
        color: var(--text-faint);
        font-size: var(--fs-12);
        line-height: var(--lh-12);
        font-weight: var(--fw-medium);
      }
      .suggestion-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 12px;
      }
      .suggestion {
        display: flex; align-items: center; gap: 12px;
        height: 84px; padding: 14px;
        border: 0; border-radius: var(--r-md);
        background: var(--surface-suggestion);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--text-body);
        font-family: inherit; text-align: left;
        transition: transform 150ms var(--ease-out), box-shadow 150ms ease, background-color 150ms ease;
      }
      @media (hover: hover) {
        .suggestion:hover {
          transform: translateY(-2px);
          background: var(--surface-suggestion-hover);
          box-shadow: inset 0 0 0 1px var(--line-strong);
        }
      }
      .suggestion:active { transform: translateY(0) scale(0.995); }
      .suggestion .glyph {
        width: 32px; height: 32px; flex: 0 0 auto;
        display: grid; place-items: center;
        border-radius: var(--r-sm);
        background: color-mix(in srgb, var(--text-strong) 4%, transparent);
        color: var(--text-muted);
      }
      .suggestion .glyph .ico { width: 17px; height: 17px; }
      .suggestion .copy { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
      .suggestion .name { font-size: var(--fs-13); line-height: 19px; font-weight: var(--fw-medium); color: var(--text-strong); }
      .suggestion .desc {
        font-size: var(--fs-12); line-height: 18px; color: var(--text-muted);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      .home-foot {
        margin-top: 20px;
        display: flex; justify-content: center; gap: 14px;
        color: var(--text-faint);
        font-size: var(--fs-11);
        line-height: var(--lh-11);
      }
      .home-foot kbd {
        font-family: inherit;
        padding: 1px 5px; border-radius: 4px;
        box-shadow: inset 0 0 0 0.5px var(--line-strong);
      }

      /* ---------- 8. 会话态：同一工作区内的连续转换 ---------- */
      .thread { display: none; width: min(760px, 100%); }
      .thread .user-msg {
        align-self: flex-end;
        max-width: 78%;
        margin: 0 0 28px;
        padding: 10px 14px;
        border-radius: var(--r-lg) var(--r-lg) 6px var(--r-lg);
        background: var(--c-primary-fill);
        color: var(--c-primary-text);
        font-size: var(--fs-14); line-height: var(--lh-14);
      }
      .thread .agent { display: flex; flex-direction: column; gap: 10px; }
      .agent-head { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: var(--fs-12); }
      .pulse {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .agent-line {
        height: 10px; border-radius: 999px;
        background: color-mix(in srgb, var(--text-strong) 6%, transparent);
      }
      .agent-line.w1 { width: 62%; }
      .agent-line.w2 { width: 88%; }
      .agent-line.w3 { width: 44%; }

      .app[data-view="conversation"] .stage { justify-content: flex-start; padding-top: 40px; }
      .app[data-view="conversation"] .home-head,
      .app[data-view="conversation"] .suggestions,
      .app[data-view="conversation"] .home-foot { display: none; }
      .app[data-view="conversation"] .home { width: min(760px, 100%); }
      .app[data-view="conversation"] .composer {
        height: auto;
        min-height: 108px;
        margin-top: 0;
        border-radius: var(--r-xl);
      }
      .app[data-view="conversation"] .thread { display: flex; flex-direction: column; }

      /* ---------- 9. 入场时序：两行卡片错峰，不是四张各飞一次 ---------- */
      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .home-title { animation: enter 180ms var(--ease-out) 80ms both; }
      .home-sub { animation: enter 160ms var(--ease-out) 130ms both; }
      .composer { animation: enter 200ms var(--ease-out) 200ms both; }
      .suggestions-head { animation: enter 160ms var(--ease-out) 300ms both; }
      .suggestion:nth-child(1), .suggestion:nth-child(2) { animation: enter 160ms var(--ease-out) 320ms both; }
      .suggestion:nth-child(3), .suggestion:nth-child(4) { animation: enter 160ms var(--ease-out) 380ms both; }
      .home-foot { animation: enter 120ms var(--ease-out) 450ms both; }

      /* ---------- 10. 窗口失焦：只降材质强调，不整体变暗 ---------- */
      body[data-window="blur"] .topbar { background: var(--surface-canvas); }
      body[data-window="blur"] .sidebar { filter: saturate(0.92); }

      /* ---------- 11. 小屏与动效降级 ---------- */
      @media (max-width: 1200px) {
        .app { grid-template-columns: 240px minmax(0, 1fr); }
      }
      @media (max-width: 1000px) {
        .app { grid-template-columns: 56px minmax(0, 1fr); }
        .sidebar { padding-inline: 8px; }
        .brand { justify-content: center; padding: 0; }
        .brand-name, .brand .tag, .new-chat span, .new-chat .keys,
        .nav-item span, .section-head, .recent, .account .meta { display: none; }
        .new-chat, .nav-item { justify-content: center; padding: 0; }
        .stage { padding: 24px; }
      }
      @media (max-width: 760px) {
        .suggestion-grid { grid-template-columns: minmax(0, 1fr); }
        .home-title { font-size: 24px; line-height: 32px; }
        .home-foot { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .home-title, .home-sub, .composer, .suggestions-head,
        .suggestion, .home-foot { animation: none !important; }
        .suggestion, .composer, .send { transition: none !important; }
        .pulse { animation: none; opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <!-- 图标：24 网格、描边 1.8，与品牌 mark 同一线条语言 -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <defs>
        <linearGradient id="brand-ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00e08a" />
          <stop offset="0.55" stop-color="#00d4a0" />
          <stop offset="1" stop-color="#00b4ff" />
        </linearGradient>
        <symbol id="i-brand" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="url(#brand-ring)" stroke-width="2" />
          <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="#99f6e4" stroke="none" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24">
          <path d="M22 12h-6l-2 3h-4l-2-3H2" />
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
        </symbol>
        <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m16 8-2.5 6.5L7 17l2.5-6.5Z" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" /></symbol>
        <symbol id="i-bubble" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="19" cy="12" r="1.2" />
        </symbol>
        <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></symbol>
        <symbol id="i-paperclip" viewBox="0 0 24 24">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24">
          <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3" />
          <path d="M1 14h6M9 8h6M17 16h6" />
        </symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6" /></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24">
          <path d="M3 3v18h18" /><path d="M7 15l4-5 4 3 5-7" />
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" /><path d="M3 12h18" />
          <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z" />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v5h5M9 13h6M9 17h4" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></symbol>
      </defs>
    </svg>

    <div class="app" data-view="home" id="app">
      <header class="topbar">
        <div class="spots" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="topbar-title" id="topbar-title">新会话</span>
        <span class="topbar-spacer"></span>
        <span class="tag">预览版</span>
        <button class="icon-button" type="button" id="theme-toggle" aria-label="切换深浅主题">
          <svg class="ico" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-moon" /></svg>
        </button>
        <button class="icon-button" type="button" aria-label="更多">
          <svg class="ico" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-more" /></svg>
        </button>
      </header>

      <aside class="sidebar" aria-label="导航">
        <div class="brand">
          <svg class="mark" aria-hidden="true"><use href="#i-brand" /></svg>
          <span class="brand-name">长虹 Craft AI</span>
        </div>

        <button class="new-chat" type="button" id="new-chat">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><use href="#i-plus" /></svg>
          <span>新会话</span>
          <span class="keys">⌘N</span>
        </button>

        <nav class="nav" aria-label="一级导航">
          <button class="nav-item" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-inbox" /></svg>
            <span>收件箱</span><span class="count">2</span>
          </button>
          <button class="nav-item" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><use href="#i-clock" /></svg>
            <span>定时任务</span>
          </button>
          <button class="nav-item" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-book" /></svg>
            <span>知识库</span>
          </button>
          <button class="nav-item" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-compass" /></svg>
            <span>探索</span>
          </button>
        </nav>

        <div class="section-head">
          最近
          <span class="actions">
            <button class="icon-button" type="button" aria-label="搜索会话">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-search" /></svg>
            </button>
          </span>
        </div>

        <div class="recent">
          <button class="recent-item" type="button" aria-current="page">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bubble" /></svg>
            <span class="label">设计规范评审</span><span class="when">刚刚</span>
          </button>
          <button class="recent-item" type="button">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bubble" /></svg>
            <span class="label">时间线滚动位置修复</span><span class="when">2 天</span>
          </button>
          <button class="recent-item" type="button">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bubble" /></svg>
            <span class="label">插件启动失败排查</span><span class="when">3 天</span>
          </button>
          <button class="recent-item" type="button">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bubble" /></svg>
            <span class="label">长虹文档链接校验</span><span class="when">上周</span>
          </button>
        </div>

        <button class="account" type="button">
          <span class="avatar" aria-hidden="true">长</span>
          <span class="meta">
            <span class="who">已连接 · 本地</span>
            <span class="where">deepseek-flash</span>
          </span>
        </button>
      </aside>

      <main class="workspace">
        <div class="stage">
          <div class="home">
            <div class="thread" id="thread" aria-live="polite">
              <p class="user-msg" id="user-msg"></p>
              <div class="agent">
                <div class="agent-head"><span class="pulse" aria-hidden="true"></span><span id="agent-state">正在读取项目结构…</span></div>
                <div class="agent-line w2"></div>
                <div class="agent-line w1"></div>
                <div class="agent-line w3"></div>
              </div>
            </div>

            <div class="home-head">
              <h1 class="home-title">从一个想法开始。</h1>
              <p class="home-sub">描述你的目标，让 Agent 帮你完成工作。</p>
            </div>

            <div class="composer" id="composer">
              <div class="composer-input">
                <textarea id="input" rows="1" placeholder="描述你想完成的任务，或直接输入问题……" aria-label="输入内容"></textarea>
              </div>
              <div class="composer-bar">
                <button class="chip" type="button" aria-label="添加附件">
                  <svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-paperclip" /></svg>
                </button>
                <button class="chip" type="button">
                  <svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-sliders" /></svg>
                  工具
                </button>
                <button class="chip" type="button">
                  Build
                  <svg class="ico" style="width: 13px; height: 13px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-chevron-down" /></svg>
                </button>
                <span class="bar-spacer"></span>
                <button class="chip" type="button">
                  deepseek-flash
                  <svg class="ico" style="width: 13px; height: 13px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-chevron-down" /></svg>
                </button>
                <button class="send" type="button" id="send" disabled aria-label="发送">
                  <svg class="ico" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-arrow-up" /></svg>
                </button>
              </div>
            </div>

            <section class="suggestions" aria-label="场景建议">
              <p class="suggestions-head">或者，从一个具体场景开始</p>
              <div class="suggestion-grid">
                <button class="suggestion" type="button" data-prompt="帮我实现以下功能：">
                  <span class="glyph"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-code" /></svg></span>
                  <span class="copy"><span class="name">编写代码</span><span class="desc">实现功能、修复问题或重构</span></span>
                </button>
                <button class="suggestion" type="button" data-prompt="请帮我研究并分析以下问题：">
                  <span class="glyph"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chart" /></svg></span>
                  <span class="copy"><span class="name">研究与分析</span><span class="desc">查阅资料、分析问题并整理结论</span></span>
                </button>
                <button class="suggestion" type="button" data-prompt="请帮我完成以下网页操作：">
                  <span class="glyph"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-globe" /></svg></span>
                  <span class="copy"><span class="name">操作网页</span><span class="desc">浏览网站、处理信息并执行操作</span></span>
                </button>
                <button class="suggestion" type="button" data-prompt="请帮我创建一份关于以下主题的文档：">
                  <span class="glyph"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-file" /></svg></span>
                  <span class="copy"><span class="name">创建文档</span><span class="desc">撰写内容、整理材料并生成文档</span></span>
                </button>
              </div>
            </section>

            <p class="home-foot"><span><kbd>⌘K</kbd> 命令面板</span><span><kbd>⌘N</kbd> 新会话</span></p>
          </div>
        </div>
      </main>
    </div>

    <script>
      const app = document.getElementById("app");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const composer = document.getElementById("composer");
      const thread = document.getElementById("thread");
      const userMsg = document.getElementById("user-msg");
      const agentState = document.getElementById("agent-state");
      const topbarTitle = document.getElementById("topbar-title");

      const syncSend = () => {
        const has = input.value.trim().length > 0;
        send.disabled = !has;
        composer.dataset.hasContent = String(has);
      };
      input.addEventListener("input", () => {
        syncSend();
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 180) + "px";
      });

      document.querySelectorAll(".suggestion").forEach((card) => {
        card.addEventListener("click", () => {
          input.value = card.dataset.prompt;
          syncSend();
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        });
      });

      // 发送：不销毁 composer，仅切换布局模式，先记录位置做连续过渡
      const toConversation = () => {
        const text = input.value.trim();
        if (!text) return;
        const before = composer.getBoundingClientRect();
        userMsg.textContent = text;
        app.dataset.view = "conversation";
        topbarTitle.textContent = "设计规范评审";
        input.value = "";
        input.style.height = "";
        syncSend();
        const after = composer.getBoundingClientRect();
        const dy = before.top - after.top;
        if (dy !== 0) {
          composer.style.transition = "none";
          composer.style.transform = `translateY(${dy}px)`;
          requestAnimationFrame(() => {
            composer.style.transition = "transform 260ms cubic-bezier(.22,1,.36,1)";
            composer.style.transform = "";
          });
        }
        thread.scrollIntoView({ block: "nearest" });
        setTimeout(() => { agentState.textContent = "正在分解任务并选择工具…"; }, 1400);
      };

      const toHome = () => {
        app.dataset.view = "home";
        topbarTitle.textContent = "新会话";
        input.value = "";
        input.style.height = "";
        input.style.transform = "";
        composer.style.transform = "";
        syncSend();
        agentState.textContent = "正在读取项目结构…";
        input.focus();
      };

      send.addEventListener("click", toConversation);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          toConversation();
        }
      });
      document.getElementById("new-chat").addEventListener("click", toHome);

      // 主题切换：demo 用，真实客户端跟随系统
      const themeToggle = document.getElementById("theme-toggle");
      const prefersDark = matchMedia("(prefers-color-scheme: dark)");
      const isDark = () =>
        document.documentElement.dataset.theme
          ? document.documentElement.dataset.theme === "dark"
          : prefersDark.matches;
      themeToggle.addEventListener("click", () => {
        document.documentElement.dataset.theme = isDark() ? "light" : "dark";
      });

      // 窗口失焦：只降低材质强调
      addEventListener("blur", () => (document.body.dataset.window = "blur"));
      addEventListener("focus", () => delete document.body.dataset.window);

      syncSend();
      input.focus({ preventScroll: true });
    </script>
  </body>
</html>
