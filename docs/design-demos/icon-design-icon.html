<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图标设计 · 技能图标</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 48px; background: #0e0f11; color: #e6e8ec; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  h2 { font-size: 12px; font-weight: 500; color: #7f8794; margin: 0 0 20px; letter-spacing: .04em; }
  .wrap { display: flex; align-items: flex-end; gap: 28px; }
  .m96 { width: 96px; height: 96px; }
  .m48 { width: 48px; height: 48px; }
  .m40 { width: 40px; height: 40px; }
  .m24 { width: 24px; height: 24px; }
  .m96 svg, .m48 svg, .m40 svg, .m24 svg { width: 100%; height: 100%; display: block; }
  .panel { background: #17181b; border: 1px solid #232529; border-radius: 12px; padding: 20px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; }
  .row:hover { background: #1d1f23; }
  .name { font-size: 13px; color: #e6e8ec; display: block; }
  .desc { font-size: 12px; color: #8b919c; display: block; }
  .strip { display: flex; align-items: center; gap: 18px; }
  .strip .label { font-size: 11px; color: #6f7682; margin-top: 8px; text-align: center; }
  .strip .item { text-align: center; }
</style>
</head>
<body>
  <h2>图标设计 · 96 / 48 / 40 / 24 像素</h2>
  <div class="wrap">
    <span class="m96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#d99a22"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="3.6" fill="#fffaf0"/><circle cx="12" cy="12" r="3.2" fill="#b87316"/><circle cx="16.4" cy="7.6" r="1.6" fill="#8a5210"/></svg></span>
    <span class="m48"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#d99a22"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="3.6" fill="#fffaf0"/><circle cx="12" cy="12" r="3.2" fill="#b87316"/><circle cx="16.4" cy="7.6" r="1.6" fill="#8a5210"/></svg></span>
    <span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#d99a22"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="3.6" fill="#fffaf0"/><circle cx="12" cy="12" r="3.2" fill="#b87316"/><circle cx="16.4" cy="7.6" r="1.6" fill="#8a5210"/></svg></span>
    <span class="m24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#d99a22"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="3.6" fill="#fffaf0"/><circle cx="12" cy="12" r="3.2" fill="#b87316"/><circle cx="16.4" cy="7.6" r="1.6" fill="#8a5210"/></svg></span>
  </div>

  <h2 style="margin-top:44px">列表里的样子</h2>
  <div class="panel" style="max-width:440px">
    <div class="row">
      <span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#d99a22"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="3.6" fill="#fffaf0"/><circle cx="12" cy="12" r="3.2" fill="#b87316"/><circle cx="16.4" cy="7.6" r="1.6" fill="#8a5210"/></svg></span>
      <span><span class="name">图标设计</span><span class="desc">24px 身份标的画法、居中与配色取舍</span></span>
    </div>
  </div>

  <h2 style="margin-top:44px">与现有内置图标并排</h2>
  <div class="strip">
    <div class="item"><span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#4c53c8"/><path d="M12 7.4c-1.6-1.1-3.6-1.5-5.7-1.2-.5.1-.9.5-.9 1v9.1c0 .6.5 1.1 1.1 1 1.8-.2 3.6.2 5 1.2.3.2.7.2 1 0 1.4-1 3.2-1.4 5-1.2.6.1 1.1-.4 1.1-1V7.2c0-.5-.4-.9-.9-1-2.1-.3-4.1.1-5.7 1.2z" fill="#eef1ff" stroke="#2b2f7a" stroke-width="1.25" stroke-linejoin="round"/><path d="M12 7.6v10.1" stroke="#2b2f7a" stroke-width="1.25" stroke-linecap="round"/><path d="M8.2 9.6c.8-.1 1.5 0 2.2.3M8.2 12c.8-.1 1.5 0 2.2.3M15.8 9.6c-.8-.1-1.5 0-2.2.3M15.8 12c-.8-.1-1.5 0-2.2.3" stroke="#9aa0ee" stroke-width="1" stroke-linecap="round"/></svg></span><div class="label">指南</div></div>
    <div class="item"><span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#f2873c"/><path d="M8.5 11.6 5.9 10.3M8.3 14.4H5.4M8.7 17.1l-2.4 1.4M15.5 11.6l2.6-1.3M15.7 14.4h2.9M15.3 17.1l2.4 1.4" stroke="#7a3a12" stroke-width="1.5" stroke-linecap="round"/><path d="M10.7 7.4 9.6 5.8M13.3 7.4l1.1-1.6" stroke="#7a3a12" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="12" cy="13.3" rx="3.7" ry="4.6" fill="#fff5e8" stroke="#7a3a12" stroke-width="1.4"/><circle cx="12" cy="8.4" r="2.1" fill="#fff5e8" stroke="#7a3a12" stroke-width="1.4"/><circle cx="11.2" cy="8.2" r=".55" fill="#7a3a12"/><circle cx="12.8" cy="8.2" r=".55" fill="#7a3a12"/><path d="M12 10.6v7" stroke="#eab391" stroke-width="1" stroke-linecap="round"/></svg></span><div class="label">反馈</div></div>
    <div class="item"><span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#6d4fd6"/><rect x="7.8" y="5.8" width="3.6" height="3.4" rx="1.5" fill="#e6dcff" stroke="#3d2790" stroke-width="1.2" stroke-linejoin="round"/><rect x="12.6" y="5.8" width="3.6" height="3.4" rx="1.5" fill="#e6dcff" stroke="#3d2790" stroke-width="1.2" stroke-linejoin="round"/><rect x="5.6" y="9.2" width="12.8" height="9" rx="2.2" fill="#f4efff" stroke="#3d2790" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.2 11.8c1-.6 2.3-.8 3.4-.5" stroke="#c9b8ff" stroke-width="1.1" stroke-linecap="round" fill="none"/></svg></span><div class="label">插件</div></div>
    <div class="item"><span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#b8406f"/><path d="M7 7.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v11.2l-5-2.9-5 2.9z" fill="#ffeef6" stroke="#77214a" stroke-width="1.25" stroke-linejoin="round"/><path d="M9.4 8.4h5.2" stroke="#e29ab8" stroke-width="1.1" stroke-linecap="round"/></svg></span><div class="label">记忆</div></div>
    <div class="item"><span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#2166d6"/><circle cx="12" cy="12" r="6.5" fill="#4f92f2" stroke="#123a7a" stroke-width="1.3"/><ellipse cx="12" cy="12" rx="2.8" ry="6.5" fill="none" stroke="#123a7a" stroke-width="1.05" opacity=".5"/><path d="M5.7 12h12.6" stroke="#123a7a" stroke-width="1.05" opacity=".5"/><path d="M7.9 8a5 5 0 0 1 3.4-2.3" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".6"/></svg></span><div class="label">浏览器</div></div>
    <div class="item"><span class="m40"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#d99a22"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="3.6" fill="#fffaf0"/><circle cx="12" cy="12" r="3.2" fill="#b87316"/><circle cx="16.4" cy="7.6" r="1.6" fill="#8a5210"/></svg></span><div class="label">图标设计</div></div>
  </div>
</body>
</html>
