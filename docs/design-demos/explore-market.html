<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件与技能 — 设计稿</title>
<style>
  :root {
    --font-ui: "Inter", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    --bg: #0e1012;
    --chip: #23262a;
    --chip-hover: #2b2f34;
    --search: #191c1f;
    --line: #2a2e33;
    --ink: #f1f3f4;
    --ink-2: #8b9096;
    --ink-3: #6b7177;
    --white: #ffffff;

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #050607;
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  .window {
    width: min(1460px, 100vw);
    height: min(940px, 100vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #1f2226;
    border-radius: 10px;
    background: var(--bg);
    box-shadow: 0 40px 100px -40px rgba(0, 0, 0, 0.9);
  }

  /* ── title bar ────────────────────────────────────────────────── */

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    flex: none;
    padding: 0 6px 0 14px;
  }

  .tb-nav { display: flex; gap: 4px; }

  .tb-nav button {
    height: 24px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: #63696f;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: color 140ms ease, background 140ms ease;
  }

  .tb-nav button:hover { color: #b9bfc5; background: rgba(255, 255, 255, 0.04); }
  .tb-nav button[aria-selected="true"] { color: #d3d8dc; }

  .tb-controls { display: flex; }

  .tb-btn {
    display: grid;
    width: 44px;
    height: 30px;
    place-items: center;
    border: 0;
    border-radius: 5px;
    background: none;
    color: #7d838a;
    cursor: pointer;
  }

  .tb-btn:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }
  .tb-btn.close:hover { background: #c42b1c; color: #fff; }
  .tb-btn svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.1; }

  /* ── page ─────────────────────────────────────────────────────── */

  .page {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .page::-webkit-scrollbar { width: 12px; }
  .page::-webkit-scrollbar-thumb {
    border: 4px solid var(--bg);
    border-radius: 999px;
    background: #2c3137;
  }

  .inner {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 26px 0 90px;
  }

  .page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }

  .sub {
    margin: 9px 0 0;
    color: var(--ink-2);
    font-size: 14px;
    line-height: 1.45;
  }

  .tools {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: none;
    padding-top: 2px;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 238px;
    height: 36px;
    padding: 0 13px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--search);
    transition: border-color 140ms ease, background 140ms ease;
  }

  .search:focus-within { border-color: #4a5057; background: #1c2024; }

  .search svg {
    width: 14px;
    height: 14px;
    flex: none;
    fill: none;
    stroke: var(--ink-3);
    stroke-width: 1.7;
    stroke-linecap: round;
  }

  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
  }

  .search input::placeholder { color: var(--ink-3); }

  .icon-btn {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: none;
    color: #9aa0a6;
    cursor: pointer;
    transition: background 130ms ease, color 130ms ease;
  }

  .icon-btn:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
  .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .add-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 36px;
    margin-left: 4px;
    padding: 0 15px;
    border: 0;
    border-radius: 18px;
    background: var(--white);
    color: #101214;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 130ms ease;
  }

  .add-btn:hover { background: #e8eaec; }
  .add-btn svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* ── scope chip ───────────────────────────────────────────────── */

  .scope { margin-top: 20px; }

  .scope button {
    height: 28px;
    padding: 0 13px;
    border: 0;
    border-radius: 14px;
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 130ms ease, color 130ms ease;
  }

  .scope button:hover { background: var(--chip-hover); }
  .scope button[aria-pressed="false"] { color: var(--ink-2); }

  /* ── groups ───────────────────────────────────────────────────── */

  .groups { margin-top: 32px; }

  .group + .group { margin-top: 56px; }

  .group-head { margin-bottom: 12px; }

  .group-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.014em;
  }

  /* skill 视图的分组用胶囊，与参考一致 */
  .groups[data-view="skill"] .group-head h2 {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 13px;
    border-radius: 14px;
    background: var(--chip);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0;
  }

  .groups[data-view="skill"] .group-head { margin-bottom: 14px; }

  .groups[data-view="skill"] .group + .group { margin-top: 40px; }

  .items {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 44px;
  }

  .item {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) 26px;
    align-items: center;
    gap: 13px;
    height: 60px;
    margin: 0 -10px;
    padding: 0 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 130ms ease;
  }

  .item:hover { background: #16191c; }

  .item:focus-visible {
    outline: none;
    background: #16191c;
    box-shadow: inset 0 0 0 1px #4a5057;
  }

  .icon {
    display: grid;
    width: 40px;
    height: 40px;
    place-items: center;
    border-radius: 10px;
    background: var(--bg-icon);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.1),
      0 1px 2px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  .icon svg { width: 24px; height: 24px; }
  .icon.letter { color: #fff; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }

  .item-main { min-width: 0; }

  .item-top { display: flex; align-items: center; gap: 6px; min-width: 0; }

  .item-name {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.006em;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--ink);
  }

  .badge {
    display: grid;
    flex: none;
    width: 13px;
    height: 13px;
    place-items: center;
    color: var(--ink-3);
  }

  .badge svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

  .item-desc {
    margin-top: 2px;
    overflow: hidden;
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .item.failed .item-desc { color: #e06b5f; }

  .item-act {
    display: grid;
    width: 26px;
    height: 26px;
    place-items: center;
    color: #7b8187;
    transition: color 130ms ease;
  }

  .item:hover .item-act { color: #d3d8dc; }

  .item-act svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ── empty ────────────────────────────────────────────────────── */

  .empty { padding: 64px 0; }

  .empty strong { display: block; font-size: 15px; font-weight: 600; }

  .empty span { display: block; margin-top: 6px; color: var(--ink-2); font-size: 13px; }

  /* ── motion ───────────────────────────────────────────────────── */

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .enter { animation: rise 380ms var(--ease) both; }

  @media (prefers-reduced-motion: reduce) {
    .enter { animation: none; }
    .item, .item-act, .scope button, .search { transition: none; }
  }

  /* ── responsive ───────────────────────────────────────────────── */

  @media (max-width: 1000px) {
    .inner { padding-left: 28px; padding-right: 28px; }
  }

  @media (max-width: 880px) {
    .items { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    body { display: block; }
    .window { width: 100vw; height: 100vh; border: 0; border-radius: 0; }
    .inner { padding: 22px 18px 70px; }
    .page-head { flex-direction: column; gap: 16px; }
    .tools { flex-wrap: wrap; width: 100%; }
    .search { flex: 1; width: auto; min-width: 150px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <nav class="tb-nav" aria-label="资源类型">
        <button type="button" data-view="plugin" aria-selected="true">插件</button>
        <button type="button" data-view="skill" aria-selected="false">技能</button>
      </nav>
      <div class="tb-controls">

    <main class="page" id="page">

            </button>
            <button class="add-btn" type="button">

            </button>
          </div>
        </header>

        <div class="scope" id="scope"></div>
        <div class="groups" id="groups"></div>
      </div>
    </main>
  </div>

        { id: "dbro", name: "dbro", desc: "查询本地数据库并解释结果", source: "local", bg: "#2b7a4b", glyph: "db" },
        { id: "grafana", name: "Grafana", desc: "读取面板与告警历史", source: "community", bg: "#d35a12", glyph: "bars" },
        { id: "amplitude", name: "Amplitude", desc: "查询留存与转化漏斗", source: "community", bg: "#1f7ae0", glyph: "bars" },
      ],
    },
    {
      name: "开发工具",
      items: [
        { id: "game-studio", name: "Game Studio", desc: "设计、原型与发布浏览器游戏", source: "community", bg: "#e8eaec", glyph: "grid", ink: true },
        { id: "superpowers", name: "Superpowers", desc: "规划、开发与调试代码", source: "community", bg: "#eef0f1", glyph: "bolt", ink: true },
        { id: "circleci", name: "CircleCI", desc: "构建、测试与部署任何应用", source: "official", bg: "#1b1d20", glyph: "node" },
        { id: "sentry", name: "Sentry", desc: "查看最近的错误与事件", source: "official", bg: "#3a2f5e", icon: "sentry" },
        { id: "build-ios", name: "Build iOS Apps", desc: "构建并交付 iOS 应用", source: "community", bg: "#4a5568", glyph: "cube" },
        { id: "build-macos", name: "Build macOS Apps", desc: "构建并交付 macOS 应用", source: "community", bg: "#4a5568", glyph: "cube" },
        { id: "github", name: "GitHub", desc: "浏览仓库、issue 与 PR", source: "official", bg: "#24292f", icon: "github" },
        { id: "jira", name: "Jira", desc: "同步 issue、看板与迭代", source: "official", bg: "#2684ff", glyph: "grid" },
        { id: "webwright", name: "Webwright", desc: "驱动真实浏览器完成操作", source: "local", bg: "#5a4bd0", glyph: "globe", state: "failed" },
        { id: "orchestrator", name: "Orchestrator", desc: "拆分任务并并行执行", source: "local", bg: "#c47a12", glyph: "node" },
        { id: "codemap", name: "代码地图", desc: "为仓库建立符号索引", source: "local", bg: "#2b7a4b", glyph: "code" },
      ],
    },
    {
      name: "效率",
      items: [
        { id: "hyt", name: "虹云通", desc: "读取消息并按白名单回复", source: "local", bg: "#2f66d0", glyph: "cloud", state: "installed" },
        { id: "clipboard", name: "剪贴板", desc: "读写系统剪贴板", source: "official", bg: "#5c646c", glyph: "doc", state: "installed" },
        { id: "schedule", name: "定时任务", desc: "按计划唤醒会话执行检查", source: "official", bg: "#c4562a", glyph: "clock", state: "installed" },
        { id: "linear", name: "Linear", desc: "同步 issue 与项目进度", source: "official", bg: "#4b52c0", glyph: "lines" },
        { id: "raycast", name: "Raycast", desc: "把常用指令固定到命令面板", source: "community", bg: "#ff6363", glyph: "bolt" },
        { id: "things", name: "Things", desc: "同步待办与项目清单", source: "community", bg: "#2f6fed", glyph: "check" },
      ],
    },
  ];

  const SKILLS = [
    {
      name: "已安装",
      items: [
        { id: "statusline", name: "Create Statusline", desc: "为 MCP 构建自定义状态栏", source: "community", bg: "#b06ad6", glyph: "bars", state: "installed" },
        { id: "image-gen", name: "Image Gen", desc: "为网站与游戏生成或编辑图片", source: "community", bg: "#3a9fd6", glyph: "grid", state: "installed" },
        { id: "openai-docs", name: "OpenAI Docs", desc: "Codex 与 ChatGPT 的问题与首发信息", source: "official", bg: "#fff", glyph: "doc", ink: true, state: "installed" },
        { id: "review-agent", name: "Review Agent", desc: "在代码变更里找出可修复的问题", source: "community", bg: "#f0f1f2", glyph: "bug", ink: true, state: "installed" },
        { id: "skill-creator", name: "Skill Creator", desc: "创建或更新一个技能", source: "official", bg: "#e8c547", glyph: "chat", ink: true, state: "installed" },
        { id: "skill-installer", name: "Skill Installer", desc: "从 openai/skills 等来源安装技能", source: "official", bg: "#e8503a", glyph: "grid", state: "installed" },
      ],
    },
    {
      name: "系统",
      items: [
        { id: "memory", name: "记忆", desc: "跨会话保存偏好与项目约定", source: "official", bg: "#2f9e6a", glyph: "bookmark", state: "installed" },
        { id: "aicraft", name: "AI Craft 使用指南", desc: "回答关于产品自身的问题", source: "official", bg: "#8a6a3a", glyph: "doc", state: "installed" },
        { id: "report", name: "问题反馈", desc: "收集诊断信息并提交问题", source: "official", bg: "#2f66d0", glyph: "flag", state: "installed" },
        { id: "plugin-creator", name: "插件创造", desc: "生成、构建并打包插件", source: "official", bg: "#4b52c0", glyph: "cube", state: "installed" },
        { id: "hyt-assistant", name: "虹云通助手", desc: "读消息、查知识库、按白名单回复", source: "local", bg: "#0f8f8a", glyph: "cloud", state: "installed" },
        { id: "commit-style", name: "提交规范", desc: "按仓库约定生成提交信息", source: "local", bg: "#3a6ea5", glyph: "check", state: "installed" },
      ],
    },
  ];

  const VIEWS = {
    plugin: {
      title: "插件",
      sub: "连接插件，让 agent 在你的各类工具中协同工作",
      groups: PLUGINS,
      placeholder: "搜索插件",
      scope: true,
    },
    skill: {
      title: "技能",
      sub: "通过任务专用技能扩展 agent 的能力",
      groups: SKILLS,
      placeholder: "搜索技能",
      scope: false,
    },
  };

  const state = {
    view: "plugin",
    q: "",
    publicOnly: true,
    installed: new Set(
      [...PLUGINS, ...SKILLS].flatMap((g) => g.items).filter((i) => i.state === "installed").map((i) => i.id),
    ),
    intro: true,
  };

  const $ = (id) => document.getElementById(id);
  const groupsEl = $("groups");
  const qEl = $("q");

  const isOn = (item) => state.installed.has(item.id);

  const iconHtml = (item) => {
    if (item.icon) return ICONS[item.icon];
    if (item.glyph) {
      const stroke = item.ink ? "#17191c" : "#fff";
      return `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${GLYPH[item.glyph]}</svg>`;
    }
    return "";
  };

  const sourceBadge = (key) => {
    const s = SOURCE[key];
    return `<span class="badge" title="来源：${s.label}" aria-label="来源：${s.label}">
      <svg viewBox="0 0 24 24"><path d="${s.icon}"/></svg>
    </span>`;
  };

  const plus = `<svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>`;
  const check = `<svg viewBox="0 0 16 16"><path d="m3.2 8.3 3.2 3.2 6.4-7"/></svg>`;

  const passes = (item) => {
    if (state.publicOnly && item.source === "local") return false;
    if (!state.q) return true;
    return `${item.name} ${item.desc} ${SOURCE[item.source].label}`.toLowerCase().includes(state.q);
  };

  function itemHtml(item) {
    const on = isOn(item);
    const failed = item.state === "failed" && !on;

    return `
      <div class="item${failed ? " failed" : ""}" role="button" tabindex="0" data-id="${item.id}"
        aria-label="${item.name}，${SOURCE[item.source].label}，${on ? "已安装" : "未安装"}">
        <span class="icon${item.glyph ? "" : " plain"}" style="--bg-icon:${item.bg}" aria-hidden="true">${iconHtml(item)}</span>
        <span class="item-main">
          <span class="item-top">
            <span class="item-name">${item.name}</span>
            ${sourceBadge(item.source)}
          </span>
          <span class="item-desc">${failed ? "加载失败，点击重试" : item.desc}</span>
        </span>
        <span class="item-act" aria-hidden="true">${on ? check : plus}</span>
      </div>`;
  }

  function render() {
    const view = VIEWS[state.view];

    $("title").textContent = view.title;
    $("sub").textContent = view.sub;
    qEl.placeholder = view.placeholder;
    groupsEl.dataset.view = state.view;

    document.querySelectorAll(".tb-nav button").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.view === state.view));
    });

    $("scope").innerHTML = view.scope
      ? `<button type="button" id="scope-btn" aria-pressed="${state.publicOnly}">公开</button>`
      : "";

    const groups = view.groups
      .map((group) => ({ group, items: group.items.filter(passes) }))
      .filter((entry) => entry.items.length > 0);

    if (groups.length === 0) {
      groupsEl.innerHTML = `
        <div class="empty">
          <strong>没有匹配的${view.title}</strong>
          <span>换个更短的关键词，或清除筛选条件。</span>
        </div>`;
      return;
    }

    const intro = state.intro;

    groupsEl.innerHTML = groups
      .map(({ group, items }, index) => {
        const delay = intro ? ` style="animation-delay:${index * 40}ms"` : "";
        return `
        <section class="group${intro ? " enter" : ""}"${delay}>
          <div class="group-head"><h2>${group.name}</h2></div>
          <div class="items">${items.map(itemHtml).join("")}</div>
        </section>`;
      })
      .join("");

    state.intro = false;
  }

  /* ── events ───────────────────────────────────────────────────── */

  document.querySelectorAll(".tb-nav button").forEach((button) => {
    button.addEventListener("click", () => {
      if (state.view === button.dataset.view) return;
      state.view = button.dataset.view;
      state.q = "";
      state.publicOnly = true;
      qEl.value = "";
      state.intro = true;
      $("page").scrollTo({ top: 0, behavior: "instant" });
      render();
    });
  });

  qEl.addEventListener("input", () => {
    state.q = qEl.value.trim().toLowerCase();
    render();
  });

  $("scope").addEventListener("click", (event) => {
    if (!event.target.closest("#scope-btn")) return;
    state.publicOnly = !state.publicOnly;
    render();
  });

  groupsEl.addEventListener("click", (event) => {
    const item = event.target.closest(".item");
    if (!item) return;
    const id = item.dataset.id;
    if (state.installed.has(id)) state.installed.delete(id);
    else state.installed.add(id);
    render();
  });

  groupsEl.addEventListener("keydown", (event) => {
    const item = event.target.closest(".item");
    if (!item) return;
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      item.click();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "/" && document.activeElement !== qEl) {
      event.preventDefault();
      qEl.focus();
    }
    if (event.key === "Escape" && document.activeElement === qEl) {
      qEl.value = "";
      state.q = "";
      render();
      qEl.blur();
    }
  });

  render();
</script>
</body>
</html>
